[install]
# One hoisted node_modules at the root: every app resolves the same React and Adyen Web copy, and
# Next's file tracing finds the shared packages without symlink chains.
linker = "hoisted"
exact = true
# A version must be a week old before an install resolves it: a hijacked release is usually
# caught and pulled within days (semgrep bun-missing-minimum-release-age).
minimumReleaseAge = 604800
